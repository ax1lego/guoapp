name: Build GuoApp Android AllSources
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: app-v0.2.64-71

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip git curl unzip wget

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;27.0.12077973
            platform-tools

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Build native lib (all-sources)
        run: |
          python3 scripts/build_native.py --platform android --abi arm64-v8a --all-sources

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Build release apk
        run: flutter build apk --release --dart-define=ALL_SOURCES=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuoApp-全源APK
          path: build/app/outputs/flutter-apk/app-release.apk
