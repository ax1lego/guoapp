name: Build GuoApp Android AllSources
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip unzip wget curl

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 手动部署 Android SDK + 阿里云镜像，绕开 dl.google.com ==========
      - name: Download Android cmdline-tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget https://mirrors.aliyun.com/android/android/repository/commandlinetools-linux-12266719_latest.zip -O cmd.zip
          unzip -q cmd.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          rm cmd.zip
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH" >> $GITHUB_PATH

      - name: Configure sdkmanager mirror & accept license
        run: |
          mkdir -p ~/.android
          echo "### Mirrored by aliyun" > ~/.android/repositories.cfg
          sdkmanager --list --no_https --proxy=none < <(echo y)
          # 安装需要的包
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" < <(echo y)

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Gradle 国内镜像替换（关键！防止gradle同步卡死google）
        run: |
          sed -i 's|google()|maven { url "https://maven.aliyun.com/repository/google" }|g' android/build.gradle
          sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/central" }|g' android/build.gradle

      - name: Compile native library
        run: python3 scripts/build_native.py --platform android --abi arm64-v8a --all-sources

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=ALL_SOURCES=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuoApp-全源APK
          path: build/app/outputs/flutter-apk/app-release.apk
