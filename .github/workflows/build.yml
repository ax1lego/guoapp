name: Build GuoApp AllSources Android
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-v0.2.64-71

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true

      - name: Install NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Configure signing (debug fallback)
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build all-sources APK
        run: python scripts/build_android.py --all-sources

      - name: Clean signing files
        if: always()
        run: python scripts/configure_signing.py --clean

      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
