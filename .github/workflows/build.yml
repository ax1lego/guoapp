name: Build GuoApp Android AllSources
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip unzip curl

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # 改成：文件存在才替换，不存在就跳过，不会报错
      - name: Replace Gradle mirror (if file exists)
        run: |
          if [ -f android/build.gradle ]; then
            sed -i 's|google()|maven { url "https://maven.aliyun.com/repository/google" }|g' android/build.gradle
            sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/central" }|g' android/build.gradle
          else
            echo "android/build.gradle not found, skip gradle mirror replace"
          fi

      - name: Compile native library
        run: python3 scripts/build_native.py --platform android --abi arm64-v8a --all-sources

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=ALL_SOURCES=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuoApp-全源APK
          path: build/app/outputs/flutter-apk/app-release.apk
