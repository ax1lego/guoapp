name: Build GuoApp Android AllSources
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码 app-v0.2.64-71
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: app-v0.2.64-71

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip git curl unzip

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: 编译原生层，开启全源 --all-sources
        run: |
          python3 scripts/build_native.py --platform android --abi arm64-v8a --all-sources

      - name: Flutter 依赖
        run: |
          flutter pub get --enforce-lockfile

      - name: 打包 Release APK（全站源版）
        run: |
          flutter build apk --release --dart-define=ALL_SOURCES=true

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: GuoApp-全源APK
          path: build/app/outputs/flutter-apk/app-release.apk
