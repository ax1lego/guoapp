name: Build GuoApp Android AllSources
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0

      - name: Install system tools
        run: sudo apt update && sudo apt install -y python3 python3-pip unzip

      - name: Build native lib
        run: python3 scripts/build_native.py --platform android --abi arm64-v8a --all-sources

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=ALL_SOURCES=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuoApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk
